{% extends "base.html" %}

{% block title %}Login | FoundDesk{% endblock %}

{% block content %}
    <h2>Login</h2>
    <form method="post" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <p>
            <label for="email">Email</label><br>
            <input id="email" name="email" type="email" maxlength="254"
                   autocomplete="username" value="{{ request.form.get('email', '') }}" required>
        </p>
        <p>
            <label for="password">Password</label><br>
            <input id="password" name="password" type="password" maxlength="128"
                   autocomplete="current-password" required>
        </p>
        <button type="submit">Login</button>
    </form>
    <p>Need an account? <a href="{{ url_for('register') }}">Register</a>.</p>
{% endblock %}
