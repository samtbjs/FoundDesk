{% extends "base.html" %}

{% block title %}Register | FoundDesk{% endblock %}

{% block content %}
    <h2>Register</h2>
    <form method="post" action="{{ url_for('register') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <p>
            <label for="full_name">Full Name</label><br>
            <input id="full_name" name="full_name" type="text" maxlength="100"
                   autocomplete="name" value="{{ request.form.get('full_name', '') }}" required>
        </p>
        <p>
            <label for="email">Email</label><br>
            <input id="email" name="email" type="email" maxlength="254"
                   autocomplete="email" value="{{ request.form.get('email', '') }}" required>
        </p>
        <p>
            <label for="password">Password (8 to 128 characters)</label><br>
            <input id="password" name="password" type="password" minlength="8"
                   maxlength="128" autocomplete="new-password" required>
        </p>
        <p>
            <label for="confirm_password">Confirm Password</label><br>
            <input id="confirm_password" name="confirm_password" type="password"
                   minlength="8" maxlength="128" autocomplete="new-password" required>
        </p>
        <button type="submit">Register</button>
    </form>
    <p>Already registered? <a href="{{ url_for('login') }}">Log in</a>.</p>
{% endblock %}
